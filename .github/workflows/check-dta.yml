name: Check DTA updates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 1 * *"

permissions:
  contents: write

concurrency:
  group: dta-update-check
  cancel-in-progress: false

jobs:
  check:
    name: Check official DTA source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check official source
        run: npm run check:dta

      - name: Read update status
        id: status
        shell: bash
        run: |
          echo "update_available=$(node -p "require('./data/generated/update-status.json').updateAvailable")" >> "$GITHUB_OUTPUT"
          echo "latest_version=$(node -p "require('./data/generated/update-status.json').latestAvailableVersion")" >> "$GITHUB_OUTPUT"

      - name: Commit check result
        shell: bash
        run: |
          git config user.name "geo-cr-api-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/generated/update-status.json

          if git diff --cached --quiet; then
            echo "No hay cambios de estado para guardar."
            exit 0
          fi

          if [ "${{ steps.status.outputs.update_available }}" = "true" ]; then
            git commit -m "chore: detectar actualización ${{ steps.status.outputs.latest_version }}"
          else
            git commit -m "chore: registrar comprobación automática DTA"
          fi

          git push origin HEAD:main
