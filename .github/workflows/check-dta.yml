name: Check DTA updates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dta-update-check
  cancel-in-progress: false

jobs:
  check:
    name: Check official DTA source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check official source
        run: npm run check:dta

      - name: Read update status
        id: status
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const status = JSON.parse(
            fs.readFileSync(
              "data/generated/update-status.json",
              "utf8"
            )
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `update_available=${status.updateAvailable}\n` +
            `latest_version=${status.latestAvailableVersion ?? "unknown"}\n`
          );
          NODE

      - name: Persist check status on main
        shell: bash
        run: |
          git config user.name "geo-cr-api-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/generated/update-status.json

          if git diff --cached --quiet; then
            echo "No hay cambios de estado para guardar."
            exit 0
          fi

          if [ "${{ steps.status.outputs.update_available }}" = "true" ]; then
            git commit -m "chore: detectar actualización ${{ steps.status.outputs.latest_version }}"
          else
            git commit -m "chore: registrar comprobación automática DTA"
          fi

          git push origin HEAD:main

      - name: Prepare DTA update
        if: ${{ steps.status.outputs.update_available == 'true' }}
        run: npm run prepare:dta-update

      - name: Validate prepared update
        if: ${{ steps.status.outputs.update_available == 'true' }}
        run: |
          npm run lint
          npm run build

      - name: Create update pull request
        if: ${{ steps.status.outputs.update_available == 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: automated/dta-update
          delete-branch: true
          draft: always-true
          commit-message: "chore: preparar actualización ${{ steps.status.outputs.latest_version }}"
          title: "chore: actualizar catálogo a ${{ steps.status.outputs.latest_version }}"
          body-path: data/generated/UPDATE_REPORT.md
          add-paths: |
            data/generated/provincias.json
            data/generated/cantones.json
            data/generated/distritos.json
            data/generated/metadata.json
            data/generated/update-status.json
            data/generated/UPDATE_REPORT.md
